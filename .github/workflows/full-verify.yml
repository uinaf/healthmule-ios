name: Full Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full iOS and UI suite
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: |
          ./scripts/install-xcodegen.sh "${RUNNER_TEMP}/xcodegen"
          echo "${RUNNER_TEMP}/xcodegen/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Run full verification
        run: make verify-full
